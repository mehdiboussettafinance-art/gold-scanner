name: Gold Scanner

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour, every day
  workflow_dispatch: {}     # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_gold.py

      - name: Save state back to repo
        run: |
          git config user.name "gold-scanner-bot"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scanner state"
          git push || true
