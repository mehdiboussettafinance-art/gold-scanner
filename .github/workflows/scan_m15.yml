name: Gold M15 Trend-Pullback Scanner (Strategy 3)

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, all day — matches the M15 candle close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M15 scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan_m15.py

      - name: Save state back to repo
        run: |
          git config user.name "gold-scanner-bot"
          git config user.email "actions@github.com"
          git add state_m15.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update M15 scanner state"
          git push || true
